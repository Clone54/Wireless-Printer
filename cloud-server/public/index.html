<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epson L3210 Cloud Print</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-2: #0f172a;
      --border: #25324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    body {
      margin: 0; padding: 20px; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 16px; }
    .header {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
    }
    .header h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .ok { background: rgba(34,197,94,0.16); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .off { background: rgba(245,158,11,0.16); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input, select, button {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--card-2); color: var(--text); font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .dropzone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 18px; text-align: center;
      background: var(--card-2); cursor: pointer; transition: border-color 0.2s;
    }
    .dropzone:hover { border-color: var(--accent); }
    .dropzone input[type="file"] { display: none; }
    .file-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .preview-box {
      margin-top: 14px; background: #070b14; border: 1px solid var(--border); border-radius: 10px;
      min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden; position: relative; padding: 12px;
    }
    .preview-box img {
      max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 6px;
      transition: transform 0.25s ease;
    }
    .preview-box img.landscape-sim { transform: rotate(90deg) scale(0.78); }
    .preview-box iframe { width: 100%; height: 420px; border: none; border-radius: 6px; background: #fff; }
    .preview-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
    .btn-primary {
      background: var(--accent); border: none; font-weight: 600; cursor: pointer; margin-top: 16px; padding: 12px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #msg { margin-top: 10px; font-size: 13px; line-height: 1.4; word-break: break-word; }
    .msg-ok { color: #4ade80; }
    .msg-err { color: #f87171; }
    .msg-info { color: #93c5fd; }
    .job { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px; }
    .job:last-child { border-bottom: none; }
    .job-status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--card-2); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Epson L3210 Cloud Print</h1>
        <p class="sub">Print PDFs &amp; photos from any network</p>
      </div>
      <span id="espBadge" class="badge off">Checking...</span>
    </div>

    <div class="grid">
      <!-- Left: File Selection & Live Preview -->
      <div class="card">
        <div class="section-title">1. Document &amp; Preview</div>
        <div class="dropzone" onclick="document.getElementById('file').click()">
          <div style="font-weight: 600; font-size: 14px;">Tap to choose a PDF or Photo</div>
          <div class="file-meta" id="fileMeta">Supports PDF, PNG, JPG (max 25 MB)</div>
          <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/*" onchange="handleFileSelect()" />
        </div>

        <div class="preview-box" id="previewBox">
          <div class="preview-empty">Select a PDF or photo above to preview it here before printing.</div>
        </div>
      </div>

      <!-- Right: Print Options & Queue -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card">
          <div class="section-title">2. Print Settings</div>

          <label for="token">Access Token</label>
          <input id="token" type="password" placeholder="Enter your PRINT_TOKEN" />

          <div class="row-2">
            <div>
              <label for="orientation">Orientation</label>
              <select id="orientation" onchange="updateOrientationPreview()">
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </div>
            <div>
              <label for="paper">Paper Size</label>
              <select id="paper">
                <option value="A4">A4</option>
                <option value="Letter">Letter</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="color">Color</label>
              <select id="color">
                <option value="RGB">Color</option>
                <option value="Gray">Grayscale</option>
              </select>
            </div>
            <div>
              <label for="quality">Quality</label>
              <select id="quality">
                <option value="PLAIN_NORMAL">Standard (Fast)</option>
                <option value="PLAIN_HIGH">High</option>
                <option value="PMPHOTO_NORMAL">Photo Glossy</option>
              </select>
            </div>
            <div>
              <label for="copies">Copies</label>
              <input id="copies" type="number" min="1" max="20" value="1" />
            </div>
          </div>

          <label for="pageMode">Pages to Print (PDF)</label>
          <select id="pageMode" onchange="toggleCustomPages()">
            <option value="all">All Pages</option>
            <option value="odd">Odd Pages Only (1, 3, 5...)</option>
            <option value="even">Even Pages Only (2, 4, 6...)</option>
            <option value="custom">Custom Page Range</option>
          </select>

          <div id="customPagesWrap" class="hidden">
            <label for="customPages">Custom Pages (e.g. 1-3, 5, 8-10)</label>
            <input id="customPages" type="text" placeholder="1-3, 5" />
          </div>

          <button class="btn-primary" id="sendBtn" onclick="sendJob()">Send to Printer</button>
          <div id="msg"></div>
        </div>

        <div class="card">
          <div class="section-title">Recent Print Jobs</div>
          <div id="jobsList" class="sub">Enter your token above to view status.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentBlobUrl = null;
    let currentIsImage = false;

    const tokenEl = document.getElementById('token');
    tokenEl.value = localStorage.getItem('print_token') || '';
    tokenEl.addEventListener('change', () => {
      localStorage.setItem('print_token', tokenEl.value.trim());
      refreshStatus();
    });

    function toggleCustomPages() {
      const mode = document.getElementById('pageMode').value;
      document.getElementById('customPagesWrap').classList.toggle('hidden', mode !== 'custom');
    }

    function updateOrientationPreview() {
      const img = document.getElementById('previewImg');
      if (!img) return;
      const isLand = document.getElementById('orientation').value === 'landscape';
      img.classList.toggle('landscape-sim', isLand);
    }

    function handleFileSelect() {
      const file = document.getElementById('file').files[0];
      const meta = document.getElementById('fileMeta');
      const box = document.getElementById('previewBox');

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      if (!file) {
        meta.textContent = 'Supports PDF, PNG, JPG (max 25 MB)';
        box.innerHTML = '<div class="preview-empty">Select a PDF or photo above to preview it here before printing.</div>';
        return;
      }

      meta.textContent = `${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
      currentBlobUrl = URL.createObjectURL(file);

      if (file.type.startsWith('image/')) {
        currentIsImage = true;
        box.innerHTML = `<img id="previewImg" src="${currentBlobUrl}" alt="Preview" />`;
        updateOrientationPreview();
      } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        currentIsImage = false;
        box.innerHTML = `
          <iframe src="${currentBlobUrl}#toolbar=0" title="PDF Preview"></iframe>
          <div style="margin-top:8px;font-size:12px;color:#94a3b8;">
            On some mobile browsers, <a href="${currentBlobUrl}" target="_blank" style="color:#60a5fa;">tap here to open full PDF preview</a>.
          </div>`;
      } else {
        currentIsImage = false;
        box.innerHTML = `<div class="preview-empty">Selected: ${file.name}</div>`;
      }
    }

    async function refreshStatus() {
      const t = tokenEl.value.trim();
      if (!t) return;
      try {
        const res = await fetch('/api/status', { headers: { 'x-print-token': t } });
        const badge = document.getElementById('espBadge');
        if (!res.ok) {
          badge.textContent = 'Auth Required';
          badge.className = 'badge off';
          return;
        }
        const data = await res.json();
        badge.textContent = data.espOnline ? `Online (${data.espPrinterStatus})` : 'Offline';
        badge.className = 'badge ' + (data.espOnline ? 'ok' : 'off');

        const list = document.getElementById('jobsList');
        if (!data.jobs.length) {
          list.textContent = 'No print jobs yet.';
        } else {
          list.innerHTML = data.jobs.map(j =>
            `<div class="job"><span>${j.name} <small style="color:#94a3b8">(${j.source})</small></span><span class="job-status">${j.status}</span></div>`
          ).join('');
        }
      } catch (e) {}
    }

    async function sendJob() {
      const t = tokenEl.value.trim();
      const file = document.getElementById('file').files[0];
      const msg = document.getElementById('msg');
      if (!t) { msg.className = 'msg-err'; msg.textContent = 'Please enter your PRINT_TOKEN first.'; return; }
      if (!file) { msg.className = 'msg-err'; msg.textContent = 'Please choose a PDF or image file.'; return; }

      const pageMode = document.getElementById('pageMode').value;
      const customPages = document.getElementById('customPages').value.trim();
      if (pageMode === 'custom' && !customPages) {
        msg.className = 'msg-err';
        msg.textContent = 'Please enter a custom page range (e.g. 1-3, 5).';
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      msg.className = 'msg-info';
      msg.textContent = 'Converting and queuing job...';

      const form = new FormData();
      form.append('file', file);
      form.append('paper', document.getElementById('paper').value);
      form.append('color', document.getElementById('color').value);
      form.append('quality', document.getElementById('quality').value);
      form.append('orientation', document.getElementById('orientation').value);
      form.append('pageMode', pageMode);
      form.append('customPages', customPages);
      form.append('copies', document.getElementById('copies').value);

      try {
        const res = await fetch('/api/print-file', {
          method: 'POST',
          headers: { 'x-print-token': t },
          body: form
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'msg-ok';
          msg.textContent = `Queued "${data.job.name}" (${Math.round(data.job.size/1024)} KB). Your ESP32-S3 will print it shortly.`;
          refreshStatus();
        } else {
          msg.className = 'msg-err';
          msg.textContent = data.error || 'Upload failed.';
        }
      } catch (e) {
        msg.className = 'msg-err';
        msg.textContent = 'Network error uploading file.';
      } finally {
        btn.disabled = false;
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
