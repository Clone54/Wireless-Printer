<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epson L3210 Cloud Print</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input, select, button { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 14px; }
    button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; margin-top: 14px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .ok { background: rgba(34,197,94,0.18); color: #4ade80; }
    .off { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .job { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .job:last-child { border-bottom: none; }
    #msg { margin-top: 10px; font-size: 13px; color: #93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Epson L3210 Cloud Print</h1>
      <p class="sub">Print PDFs or photos from any network</p>
      <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span class="sub">ESP32-S3 Status:</span>
        <span id="espBadge" class="badge off">Checking...</span>
      </div>
    </div>

    <div class="card">
      <label for="token">Access Token (saved in this browser)</label>
      <input id="token" type="password" placeholder="Enter your PRINT_TOKEN" />

      <label for="file">PDF or Image (PNG / JPG)</label>
      <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/*" />

      <div class="row">
        <div>
          <label for="paper">Paper</label>
          <select id="paper"><option value="A4">A4</option><option value="Letter">Letter</option></select>
        </div>
        <div>
          <label for="color">Color</label>
          <select id="color"><option value="RGB">Color</option><option value="Gray">Grayscale</option></select>
        </div>
        <div>
          <label for="copies">Copies</label>
          <input id="copies" type="number" min="1" max="20" value="1" />
        </div>
      </div>

      <button id="sendBtn" onclick="sendJob()">Send to Printer</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <div style="font-size: 13px; color: var(--muted); margin-bottom: 8px;">Recent Print Jobs</div>
      <div id="jobsList" class="sub">Enter your token above to view status.</div>
    </div>
  </div>

  <script>
    const tokenEl = document.getElementById('token');
    tokenEl.value = localStorage.getItem('print_token') || '';
    tokenEl.addEventListener('change', () => {
      localStorage.setItem('print_token', tokenEl.value.trim());
      refreshStatus();
    });

    async function refreshStatus() {
      const t = tokenEl.value.trim();
      if (!t) return;
      try {
        const res = await fetch('/api/status', { headers: { 'x-print-token': t } });
        if (!res.ok) {
          document.getElementById('espBadge').textContent = 'Auth Required';
          document.getElementById('espBadge').className = 'badge off';
          return;
        }
        const data = await res.json();
        const badge = document.getElementById('espBadge');
        badge.textContent = data.espOnline ? `Online (${data.espPrinterStatus})` : 'Offline';
        badge.className = 'badge ' + (data.espOnline ? 'ok' : 'off');

        const list = document.getElementById('jobsList');
        if (!data.jobs.length) {
          list.textContent = 'No print jobs yet.';
        } else {
          list.innerHTML = data.jobs.map(j =>
            `<div class="job"><span>${j.name} <small style="color:#94a3b8">(${j.source})</small></span><span>${j.status}</span></div>`
          ).join('');
        }
      } catch (e) {}
    }

    async function sendJob() {
      const t = tokenEl.value.trim();
      const file = document.getElementById('file').files[0];
      const msg = document.getElementById('msg');
      if (!t) { msg.textContent = 'Please enter your PRINT_TOKEN first.'; return; }
      if (!file) { msg.textContent = 'Please choose a PDF or image file.'; return; }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      msg.textContent = 'Converting and queuing job...';

      const form = new FormData();
      form.append('file', file);
      form.append('paper', document.getElementById('paper').value);
      form.append('color', document.getElementById('color').value);
      form.append('copies', document.getElementById('copies').value);

      try {
        const res = await fetch('/api/print-file', {
          method: 'POST',
          headers: { 'x-print-token': t },
          body: form
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = `Queued "${data.job.name}" (${Math.round(data.job.size/1024)} KB). Your ESP32-S3 will print it shortly.`;
          document.getElementById('file').value = '';
          refreshStatus();
        } else {
          msg.textContent = data.error || 'Upload failed.';
        }
      } catch (e) {
        msg.textContent = 'Network error uploading file.';
      } finally {
        btn.disabled = false;
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
